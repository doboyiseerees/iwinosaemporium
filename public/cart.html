<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Luxury Collection</title>
    <link rel="stylesheet" href="black.css">
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body>

    <nav class="navbar">
        <div class="brand-name"> Iwinosa's Emporium.</div>
        <ul class="nav-links">
            <li><a href="black.html">Home</a></li>
            <li><a href="winery-page.html">Winery</a></li>
            <li><a href="Clothing-page.html">Clothing</a></li>
        </ul>
    </nav>

    <section class="cart-section">
        <div class="container">
            <h1 class="section-header" style="text-align: left; margin-bottom: 30px;">Shopping Bag</h1>
            
            <div class="cart-layout">
                
                <div class="cart-items-list" id="cart-items-container">
                    <p>Your cart is currently empty.</p>
                </div>

                <div class="cart-summary">
                    <h3>Order Summary</h3>
                    
                    
                    <div class="summary-row total">
                        <span>Total</span>
                        <span id="cart-total">$0.00</span>
                    </div>

                    <button class="cta-btn" id="checkout-btn" >Checkout</button>
                    
                    
                    <div style="margin-top: 20px; text-align: center;">
                        <a href="black.html" class="btn-link">Continue Shopping</a>
                    </div>
                </div>

            </div>
        </div>
    </section>


    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function loadCart() {
            const container = document.getElementById('cart-items-container');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            // 1. Check if empty
            if (cart.length === 0) {
                container.innerHTML = '<p>Your cart is empty.</p>';
                updateTotals(0);
                return;
            }

            // 2. Fetch Item Details (Because local storage only has ID and Qty)
            // We need to fetch the full product list to get names/images/prices
            fetch('/api/items')
                .then(res => res.json())
                .then(products => {
                    container.innerHTML = '';
                    let grandTotal = 0;

                    cart.forEach((cartItem, index) => {
                        // Find the full product details based on ID
                        const product = products.find(p => p.id == cartItem.id);
                        
                        if (product) {
                            const itemTotal = product.price * cartItem.quantity;
                            grandTotal += itemTotal;

                            const row = document.createElement('div');
                            row.className = 'cart-item';
                            row.innerHTML = `
                                <div class="cart-img" style="background-image: url('${product.image}');"></div>
                                
                                <div class="cart-details">
                                    <h4>${product.name}</h4>
                                    <p class="unit-price">$${parseFloat(product.price).toFixed(2)}</p>
                                    
                                    <div class="qty-control">
                                        <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                                        <span class="qty-number">${cartItem.quantity}</span>
                                        <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                                    </div>
                                </div>
                                
                                <div style="text-align:right;">
                                    <p style="font-weight:700;">$${itemTotal.toFixed(2)}</p>
                                    <button class="remove-action" onclick="removeItem(${index})">Remove</button>
                                </div>
                            `;
                            container.appendChild(row);
                        }
                    });

                    updateTotals(grandTotal);
                })
                .catch(err => console.error("Error loading cart items:", err));
        }

        // --- UPDATE TOTALS (The function that was breaking) ---
        function updateTotals(total) {
            // We now have elements with these IDs in the HTML above
            const totalEl = document.getElementById('cart-total');
            const subtotalEl = document.getElementById('subtotal-price');
            
            if (totalEl) totalEl.innerText = '$' + total.toFixed(2);
            if (subtotalEl) subtotalEl.innerText = '$' + total.toFixed(2);
        }

        // --- QUANTITY LOGIC ---
        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            
            cart[index].quantity += change;

            // If quantity drops to 0, remove item
            if (cart[index].quantity < 1) {
                cart.splice(index, 1);
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            
            // Reload the page logic to show new numbers
            loadCart();
            // Also update the navbar count from black.js logic
            updateCartCount(); 
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            loadCart();
            updateCartCount();
        }

        // Re-using the navbar updater from black.js
        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const countSpan = document.getElementById('cart-count');
            if (countSpan) countSpan.innerText = totalCount;
        }
    </script>
    <script>
    const STRIPE_KEY = 'pk_test_51SkRSLF4PldbqlsvtOZyPz8QULNT0fZKJoIqQxCWkjW7wFcRiDhUONHKQWVv2MM9cm96vUEvr0R3yn8JTSq1pbQb008x2ORLLn';
    const stripe = Stripe(STRIPE_KEY);
    const checkoutBtn = document.getElementById('checkout-btn');

    if (checkoutBtn) {
        checkoutBtn.addEventListener('click', async () => {
            // 1. Get the cart data from LocalStorage
            const storedCart = localStorage.getItem('cart');
            
            if (!storedCart) {
                alert("Your cart is empty!");
                return;
            }

            const cartData = JSON.parse(storedCart); // Example: [{id: 1, quantity: 2}, {id: "membership", quantity: 1}]

            // 2. Visual Feedback
            const originalText = checkoutBtn.innerText;
            checkoutBtn.innerText = "Preparing Payment...";
            checkoutBtn.disabled = true;

            try {
                // 3. Send Cart to Server
                const response = await fetch('/api/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cart: cartData }) // Send the array inside a "cart" object
                });

                const session = await response.json();

                if (session.error) {
                    throw new Error(session.error);
                }

                // 4. Redirect to Stripe
                if (session.url) {
                    window.location.href = session.url;
                }

            } catch (error) {
                console.error('Checkout Error:', error);
                alert("Error: " + error.message);
                checkoutBtn.innerText = originalText;
                checkoutBtn.disabled = false;
            }
        });
    }
</script>
</body>
</html>
