<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Inventory Manager</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; background: #f0f0f0; color: #333; }
        
        /* Form Styling */
        .form-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { margin-top: 0; color: #111; border-bottom: 2px solid #d4af37; padding-bottom: 10px; display: inline-block; }
        
        label { display: block; margin-top: 20px; font-weight: 600; font-size: 0.95rem; color: #444; }
        input, select, textarea { width: 100%; padding: 14px; margin-top: 8px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #d4af37; outline: none; }
        
        /* Sections */
        .form-section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
        .form-section:last-child { border-bottom: none; }
        .section-title { font-size: 1.1rem; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; }

        /* File Input Styling */
        input[type="file"] { background: #fafafa; padding: 10px; border: 1px dashed #ccc; }

        /* Button Styling */
        .submit-btn { background: #000; color: #d4af37; padding: 18px; border: none; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; font-size: 1.1rem; border-radius: 6px; transition: 0.3s; }
        .submit-btn:hover { background: #333; transform: translateY(-2px); }

        /* Motivation Section Styling */
        #motivation-fields {
            background: #fff8e1; /* Light gold tint */
            border-left: 5px solid #d4af37;
            padding: 20px;
            margin-top: 15px;
            border-radius: 4px;
            display: none; /* Hidden by default */
        }

        /* Grid for List */
        .admin-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 40px; }
        .admin-card { background: #fff; border: 1px solid #eee; padding: 20px; border-radius: 8px; display: flex; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .admin-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; margin-right: 20px; border: 1px solid #eee; }
        .admin-info { flex-grow: 1; }
        .admin-info h4 { margin: 0; font-size: 1.1rem; color: #000; }
        .admin-info p { margin: 5px 0 0; color: #666; font-size: 0.9rem; }
        
        .delete-btn { background-color: #fff; color: #ff4444; border: 1px solid #ff4444; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .delete-btn:hover { background-color: #ff4444; color: white; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Add New Inventory Item</h2>
        <form id="add-item-form">
            
            <div class="form-section">
                <p class="section-title">Basic Information</p>
                
                <label>Category</label>
                <select id="category" name="category" required onchange="toggleFields()">
                    <option value="wine">Wine / Drink</option>
                    <option value="clothing">Clothing / Attire</option>
                    <option value="suit">Suits</option>
                    <option value="motivation">Motivation / Hero</option>
                </select>

                <label>Product Name</label>
                <input type="text" id="name" name="name" required placeholder="e.g. Royal Robe or Nelson Mandela">

                <label>Price ($)</label>
                <input type="number" id="price" name="price" step="0.01" required placeholder="0.00">

                <label>Product Image</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>

            <div id="motivation-fields">
                <p style="margin-top:0; color:#d4af37; font-weight:bold;">Motivation Details</p>
                <label>Role</label>
                <input type="text" id="role" name="role" placeholder="e.g. Civil Rights Leader">
                <label>Quote</label>
                <textarea id="quote" name="quote" rows="2" placeholder="Enter the famous quote here..."></textarea>
            </div>

            <div class="form-section">
                <p class="section-title">Product Details (Accordion Content)</p>

                <label>Main Description (About this Item)</label>
                <textarea id="description" name="description" rows="4" required placeholder="This goes in the first accordion tab..."></textarea>

                <label>Material / Care / Specs (Optional)</label>
                <textarea id="specs" name="specs" rows="3" placeholder="e.g. 100% Cotton, Dry Clean Only, or 14% ABV..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Upload Item</button>
        </form>
    </div>

    <hr style="margin: 50px 0; border-color: #ddd;">
    <h3 style="text-align:center;">Current Inventory</h3>
    <div id="admin-list" class="admin-grid">
        <p style="text-align:center;">Loading items...</p>
    </div>

    <script>
        const API_URL = '/api/products'; 

        // 1. Toggle Fields Logic
        function toggleFields() {
            const cat = document.getElementById('category').value;
            const extraFields = document.getElementById('motivation-fields');
            const priceInput = document.getElementById('price');
            
            if (cat === 'motivation') {
                extraFields.style.display = 'block';
                priceInput.value = 0; 
            } else {
                extraFields.style.display = 'none';
            }
        }

        // 2. Handle Form Submit
        document.getElementById('add-item-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.querySelector('.submit-btn');
            const originalText = btn.innerText;
            btn.innerText = "Uploading...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('category', document.getElementById('category').value);
            formData.append('price', document.getElementById('price').value);
            
            // Text Areas
            formData.append('description', document.getElementById('description').value);
            formData.append('specs', document.getElementById('specs').value); // NEW FIELD
            
            formData.append('image', document.getElementById('image').files[0]);
            
            // Motivation Fields
            formData.append('role', document.getElementById('role').value);
            formData.append('quote', document.getElementById('quote').value);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData 
                });

                if (response.ok) {
                    alert('Item added successfully!');
                    e.target.reset(); 
                    toggleFields(); 
                    loadAdminInventory(); 
                } else {
                    alert('Error adding item. Check server console.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection error.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        });

        // 3. Load Inventory List
        document.addEventListener('DOMContentLoaded', loadAdminInventory);

        async function loadAdminInventory() {
            const container = document.getElementById('admin-list');
            const fetchUrl = '/api/items'; 

            try {
                const res = await fetch(fetchUrl);
                const items = await res.json();
                
                container.innerHTML = ''; 

                if (items.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">No items found.</p>';
                    return;
                }

                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'admin-card';
                    div.innerHTML = `
                        <img src="${item.image}" alt="img">
                        <div class="admin-info">
                            <h4>${item.name}</h4>
                            <p><strong>${item.category}</strong> | $${item.price}</p>
                            ${item.specs ? `<p style="font-size:0.8rem; color:#888;">Specs: ${item.specs.substring(0,20)}...</p>` : ''}
                        </div>
                        <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p>Error loading items.</p>';
            }
        }

        // 4. Delete Item
        async function deleteItem(id) {
            if(!confirm("Permanently delete this item?")) return;
            try {
                const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadAdminInventory();
                } else {
                    alert("Failed to delete.");
                }
            } catch (err) {
                alert("Error connecting to server.");
            }
        }
    </script>
</body>
</html>
